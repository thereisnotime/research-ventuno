# Genie LLM API on the LAN: http://<board-ip>:9001/v1 (OpenAI-compatible, no auth).
# Mirrors Arduino's service_compose.yaml for the genie service, but binds 0.0.0.0 and keeps one model loaded.
services:
  genie:
    image: artifacts.codelinaro.org/iot-solutions-microservices/genai-llm-vlm-service:1.5.0
    container_name: genie
    user: 0:0
    restart: on-failure:2
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
    working_dir: /mnt/work/models
    ports:
      - 0.0.0.0:9001:9001
    cap_add: [SYS_RESOURCE]
    environment:
      - ADHOC_MODE=true
      - LOG_LEVEL=ERROR
      - GENAI_PORT=9001
      - GENAI_CONTEXT_CAPPING=4096
      - MAX_ACTIVE_MODELS=1
      - DEFAULT_MAX_COMPLETION_TOKENS=512
      # History eviction runs a facts-extraction pass that crashes the LLM process (SDK 14003 after); keep it off
      - HISTORY_EVICTION_THRESHOLD=100
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    oom_score_adj: -500
    mem_limit: 10g
    shm_size: 2g
    devices:
      - /dev/dma_heap/system
      - /dev/fastrpc-cdsp
    volumes:
      - /sys/firmware/devicetree/base/model:/run/device-model
      - /usr/share/qcom:/run/host-qcom:ro
      - /var/lib/arduino-app-cli/models/genai:/mnt/work/models/
    stop_grace_period: 10s
    command: ["hypercorn", "openapi_server.main:app", "--bind", "0.0.0.0:9001"]
